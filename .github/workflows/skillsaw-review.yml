name: Skillsaw Review

on:
  workflow_run:
    workflows: ["Skillsaw"]
    types: [completed]

concurrency:
  group: skillsaw-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: stbenjam/skillsaw/review@f9819d2de4d69100f8544175d4045f34f0282b66 # v0.17.0
