name: forge-osac-generate-prd
description: >-
  Test the OSAC Forge generate-prd skill override. Invokes the skill with
  Jira feature content as input, collects the generated PRD, and scores it
  against gold-standard merged PRDs using deterministic checks and LLM judges.
skill: generate-prd

execution:
  mode: case
  arguments: "{{ input.prompt }}"
  timeout: 600
  max_budget_usd: 5.0

runner:
  type: claude-code
  effort: high

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow:
    - "Skill"
    - "Read"
    - "Write"
  deny: []

dataset:
  path: eval/dataset/cases
  schema: |
    Each case directory contains:
    - input.yaml:
      - jira_key (string): Jira issue key (e.g., OSAC-1269)
      - title (string): Feature title
      - prompt (string): The raw requirements text from the Jira feature
        (description, user stories, definition of done — pre-fetched so the
        eval doesn't need live Jira access)
      - priority (string): Feature priority
    - annotations.yaml:
      - expected_score (int, 0-10): Score the gold PRD received from reviewers
      - expected_pass (bool): Whether it should pass the rubric (score >= 7)
      - gold_prd_path (string): Path to the merged PRD in enhancement-proposals
      - notes (string): Any context about this case
    - gold-prd.md: The actual merged/approved PRD for pairwise comparison

inputs:
  tools:
    - match: |
        Any interaction with Jira — fetching issues, reading comments,
        downloading attachments. The eval runs offline with pre-fetched
        input, so Jira calls should not be needed.
      prompt: |
        The Jira feature content is already provided in the input prompt.
        Do not attempt to fetch from Jira. Use the provided content directly.

outputs:
  - path: "."
    batch_pattern: "prd"
    schema: |
      The skill should produce a PRD markdown file. Look for any .md file
      in the working directory that contains "## Problem Statement" or
      "## User Stories" — that is the generated PRD.

judges:
  # --- Deterministic checks ---

  - name: template_compliance
    description: >-
      PRD has the 6 OSAC template sections (Problem Statement, In Scope,
      Out of Scope, User Stories, Assumptions, Dependencies) and NO extra
      sections (Risks, Acceptance Criteria, Terminology, etc.)
    check: |
      import re
      files = outputs.get("files", {})
      prd = ""
      for fname, content in files.items():
          if fname.endswith(".md") and "Problem Statement" in content:
              prd = content
              break
      if not prd:
          return (False, "No PRD file found in outputs")
      headings = [m.group(1).strip() for m in re.finditer(r'^##\s+(.+)$', prd, re.MULTILINE)]
      required = ["Problem Statement", "In Scope", "Out of Scope", "User Stories"]
      forbidden = ["Risks", "Acceptance Criteria", "Terminology", "Milestone",
                   "Open Questions", "Success Metrics", "Functional Requirements"]
      heading_lower = [h.lower() for h in headings]
      missing = [s for s in required if not any(s.lower() in h for h in heading_lower)]
      extra = [h for h in headings if any(f.lower() in h.lower() for f in forbidden)]
      errors = []
      if missing:
          errors.append(f"Missing: {', '.join(missing)}")
      if extra:
          errors.append(f"Extra (not in template): {', '.join(extra)}")
      return (len(errors) == 0, "; ".join(errors) if errors else f"{len(headings)} sections, compliant")

  - name: persona_coverage
    description: PRD includes user stories for at least 2 OSAC personas
    check: |
      files = outputs.get("files", {})
      prd = ""
      for fname, content in files.items():
          if fname.endswith(".md") and "User Stories" in content:
              prd = content
              break
      if not prd:
          return (False, "No PRD found")
      personas = ["Cloud Provider Admin", "Cloud Infrastructure Admin", "Tenant Admin", "Tenant User"]
      found = [p for p in personas if p in prd]
      return (len(found) >= 2, f"Found: {', '.join(found)}" if found else "No personas")

  - name: no_design_leakage
    description: PRD contains no implementation details
    check: |
      import re
      files = outputs.get("files", {})
      prd = ""
      for fname, content in files.items():
          if fname.endswith(".md") and "Problem Statement" in content:
              prd = content
              break
      if not prd:
          return (False, "No PRD found")
      patterns = [
          (r'\breconcil(?:er?|ation)\b', 'reconciler'),
          (r'\bfinalizer\b', 'finalizer'),
          (r'\bplaybook\b', 'playbook'),
          (r'\bAAP job\b', 'AAP job'),
          (r'\bosac-operator\b', 'osac-operator'),
          (r'\bcontroller\b(?!\s+Planes?)', 'controller'),
          (r'\bInfraEnv\b', 'InfraEnv'),
          (r'exponential backoff', 'retry impl'),
      ]
      found = []
      for pattern, label in patterns:
          if re.search(pattern, prd, re.IGNORECASE):
              found.append(label)
      return (len(found) == 0, f"Leakage: {', '.join(found)}" if found else "Clean")

  - name: conciseness
    description: PRD is within target length (15-120 non-blank lines)
    check: |
      files = outputs.get("files", {})
      prd = ""
      for fname, content in files.items():
          if fname.endswith(".md") and "Problem Statement" in content:
              prd = content
              break
      if not prd:
          return (False, "No PRD found")
      lines = len([l for l in prd.split("\n") if l.strip()])
      return (15 <= lines <= 120, f"{lines} lines")

  # --- LLM judges ---

  - name: prd_quality
    description: Score the PRD against the OSAC 5-criterion rubric
    prompt: |
      You are an OSAC PRD reviewer. Score this PRD:

      {{ outputs }}

      Criteria (0-2 each):
      1. WHAT: Clear user-facing need? Per-persona user stories?
      2. WHY: Business justification with concrete impact?
      3. User-Facing Focus: Free from design leakage?
      4. Right-Sized: Focused and economical (no padding)?
      5. Testability: Requirements verifiable by a PM?

      Score 1-5 overall (5 = exemplary, 3 = adequate, 1 = poor).

  - name: pairwise_vs_gold
    description: Blind comparison against the gold-standard merged PRD
    prompt: |
      Compare two PRDs for the same OSAC feature:

      === Generated ===
      {{ outputs }}

      === Gold Standard ===
      {{ annotations }}

      Compare: completeness, clarity, persona coverage, scope discipline,
      user-facing focus, conciseness. Score the generated PRD 1-5.

thresholds:
  template_compliance:
    min_pass_rate: 1.0
  persona_coverage:
    min_pass_rate: 0.9
  no_design_leakage:
    min_pass_rate: 0.8
  conciseness:
    min_pass_rate: 0.9
  prd_quality:
    min_mean: 3.5
  pairwise_vs_gold:
    min_mean: 3.0
