name: prd-creator-eval
description: Evaluate autonomous PRD generation quality against known-good merged PRDs

dataset:
  path: eval/dataset/cases
  schema: |
    Each case directory contains:
    - input.yaml: Test input with fields:
      - jira_key (string): Jira issue key (e.g., OSAC-1269)
      - title (string): Feature title
      - priority (string): Feature priority
    - annotations.yaml: Expected quality with fields:
      - expected_score (int, 0-10): PRD reviewer score
      - expected_pass (bool): Whether it should pass
      - gold_prd_path (string): Path to merged PRD
    - gold-prd.md: The actual merged/approved PRD for comparison

judges:
  # --- Deterministic checks ---

  - name: structure_valid
    description: Verify PRD has all required sections
    check: |
      files = outputs.get("files", {})
      prds = {k: v for k, v in files.items() if k.startswith("artifacts/prd-tasks/") and k.endswith(".md") and not k.endswith("-source.md")}
      if not prds:
          return (False, "No PRD task files found")
      errors = []
      for fname, content in sorted(prds.items()):
          required = ["Problem Statement", "In Scope", "Out of Scope", "User Stories"]
          missing = [s for s in required if f"## {s}" not in content and f"# {s}" not in content]
          if missing:
              errors.append(f"{fname}: missing sections: {', '.join(missing)}")
      return (len(errors) == 0, "; ".join(errors) if errors else f"{len(prds)} PRDs structurally valid")

  - name: persona_coverage
    description: Verify PRD includes user stories for OSAC personas
    check: |
      files = outputs.get("files", {})
      prds = {k: v for k, v in files.items() if k.startswith("artifacts/prd-tasks/") and k.endswith(".md") and not k.endswith("-source.md")}
      if not prds:
          return (False, "No PRD task files found")
      errors = []
      personas = ["Cloud Provider Admin", "Cloud Infrastructure Admin", "Tenant Admin", "Tenant User"]
      for fname, content in sorted(prds.items()):
          found = [p for p in personas if p in content]
          if len(found) < 2:
              errors.append(f"{fname}: only {len(found)} personas mentioned ({', '.join(found)})")
      return (len(errors) == 0, "; ".join(errors) if errors else f"All PRDs cover personas")

  - name: no_design_leakage
    description: Check PRD doesn't contain implementation details
    check: |
      import re
      files = outputs.get("files", {})
      prds = {k: v for k, v in files.items() if k.startswith("artifacts/prd-tasks/") and k.endswith(".md") and not k.endswith("-source.md")}
      if not prds:
          return (False, "No PRD task files found")
      errors = []
      leakage_patterns = [
          (r'\breconcil(?:er?|ation)\b', 'reconciler/reconciliation'),
          (r'\bfinalizer\b', 'finalizer'),
          (r'\bosac-operator\b', 'osac-operator (internal component)'),
          (r'\bAAP job\b', 'AAP job'),
          (r'\bplaybook\b', 'playbook'),
          (r'\benv var\b', 'env var'),
          (r'\bcontroller\b(?!\s+Planes?)', 'controller (not in "Hosted Control Planes")'),
      ]
      for fname, content in sorted(prds.items()):
          for pattern, label in leakage_patterns:
              matches = re.findall(pattern, content, re.IGNORECASE)
              if matches:
                  errors.append(f"{fname}: design leakage ({label})")
      return (len(errors) == 0, "; ".join(errors[:5]) if errors else "No design leakage detected")

  - name: review_exists
    description: Verify a review file was produced for each PRD
    check: |
      files = outputs.get("files", {})
      prds = [k for k in files if k.startswith("artifacts/prd-tasks/") and k.endswith(".md") and not k.endswith("-source.md")]
      reviews = [k for k in files if k.startswith("artifacts/prd-reviews/") and k.endswith("-review.md")]
      if not prds:
          return (False, "No PRD files found")
      if not reviews:
          return (False, "No review files found")
      return (True, f"{len(prds)} PRDs, {len(reviews)} reviews")

  - name: frontmatter_valid
    description: Verify review files have valid YAML frontmatter with required fields
    check: |
      import yaml
      files = outputs.get("files", {})
      reviews = {k: v for k, v in files.items() if k.endswith("-review.md")}
      if not reviews:
          return (False, "No review files to check")
      errors = []
      for fname, content in sorted(reviews.items()):
          parts = content.split('---', 2)
          if len(parts) < 3:
              errors.append(f"{fname}: missing frontmatter")
              continue
          try:
              fm = yaml.safe_load(parts[1])
          except yaml.YAMLError as e:
              errors.append(f"{fname}: invalid YAML: {e}")
              continue
          for req in ['prd_id', 'score', 'pass', 'recommendation']:
              if req not in fm:
                  errors.append(f"{fname}: missing {req}")
          score = fm.get('score')
          if score is not None and not (0 <= score <= 10):
              errors.append(f"{fname}: score {score} out of range")
      return (len(errors) == 0, "; ".join(errors[:5]) if errors else f"{len(reviews)} reviews valid")

  # --- LLM judges ---

  - name: prd_quality
    description: |
      Assess the quality of the generated PRD against OSAC standards and the
      gold-standard merged PRD.
    prompt: |
      You are an independent evaluator assessing the quality of an automatically
      generated OSAC PRD (Product Requirements Document).

      Here are the produced artifacts:

      {{ outputs }}

      The test case annotations (including expected quality) are:

      {{ annotations }}

      If a gold-standard PRD (gold-prd.md) is available in the test case, compare
      the generated PRD against it.

      Assess PRD quality across these criteria, then provide a single score 1-5:

      **Quality criteria** (the PRD should):
      - Have a clear, user-focused Problem Statement (pain + cost of inaction)
      - Include user stories grouped by OSAC persona (Cloud Provider Admin,
        Cloud Infrastructure Admin, Tenant Admin, Tenant User)
      - Describe user-observable capabilities (no design leakage)
      - Have exhaustive Out of Scope with deferral notes
      - Be right-sized for one coherent feature
      - Have specific, testable user stories (not generic "manage X")

      **Comparison with gold PRD** (if available):
      - Does the generated PRD cover the same scope?
      - Are the same personas identified?
      - Is the level of detail comparable?
      - Are key requirements preserved?

      Score 1-5:
      - **5**: Comparable to gold PRD — all criteria strong, minimal differences
      - **4**: Good — covers most of the gold PRD's scope with minor gaps
      - **3**: Adequate — covers core scope but missing important details
      - **2**: Below standard — significant gaps vs gold PRD
      - **1**: Poor — fundamentally different scope or quality

  - name: revision_quality
    description: |
      Assess whether auto-revisions improved the PRD quality.
    prompt: |
      You are an independent evaluator assessing the quality of automated PRD
      revisions. The pipeline may have auto-revised the PRD to improve its
      rubric scores.

      Here are the produced artifacts:

      {{ outputs }}

      Compare the original PRD (in artifacts/prd-originals/) against the revised
      version (in artifacts/prd-tasks/) and the review (in artifacts/prd-reviews/).

      If no revision was performed (no file in prd-originals/): assess the
      pipeline's decision not to revise. If the PRD is already high quality
      (score >= 8), skipping is correct — score 4-5.

      If a revision was performed:
      - Did revisions genuinely improve the PRD?
      - Was important content preserved?
      - Was design leakage reframed (not just deleted)?
      - Were new user stories well-formed?

      Score 1-5:
      - **5**: Revision substantially improved or correctly skipped
      - **4**: Good improvements, minor gaps
      - **3**: Mixed — some improvements but also issues
      - **2**: Marginal — cosmetic changes only
      - **1**: Harmful — made PRD worse

  - name: pairwise_vs_gold
    description: |
      Blind pairwise comparison of generated PRD vs the gold-standard merged PRD.
    prompt: |
      You are comparing two OSAC PRDs for the same feature. One was written by a
      human (possibly AI-assisted) and merged after review. The other was generated
      autonomously.

      Both PRDs should follow the OSAC template:
      - Problem Statement
      - In Scope / Out of Scope
      - User Stories (by persona)
      - Assumptions (optional)
      - Dependencies (optional)

      Here are the artifacts:

      {{ outputs }}

      The gold-standard PRD is in the test case as gold-prd.md.

      Compare the two PRDs blind (don't assume the gold is better):

      1. **Completeness**: Which covers the feature scope more thoroughly?
      2. **Clarity**: Which is clearer and more specific?
      3. **Persona coverage**: Which has better user stories?
      4. **Scope discipline**: Which has better In Scope / Out of Scope?
      5. **User-facing focus**: Which avoids design leakage better?

      Verdict: "A is better", "B is better", or "Tie"
      Score 1-5 for the generated PRD (not the gold):
      - **5**: Generated PRD is equal or better than gold
      - **4**: Generated PRD is slightly worse but comparable
      - **3**: Generated PRD is noticeably worse
      - **2**: Generated PRD is significantly worse
      - **1**: Generated PRD is fundamentally different/inferior

thresholds:
  structure_valid:
    min_pass_rate: 1.0
  persona_coverage:
    min_pass_rate: 0.9
  no_design_leakage:
    min_pass_rate: 0.8
  review_exists:
    min_pass_rate: 1.0
  frontmatter_valid:
    min_pass_rate: 1.0
  prd_quality:
    min_mean: 3.5
  revision_quality:
    min_mean: 3.0
  pairwise_vs_gold:
    min_mean: 3.0
